<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horror Haverok Tier List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.webp" type="image/webp">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img class="horror-brand-icon" src="icon.webp" alt="Horror Haverok">
            Horror<span>Haverok</span>
        </div>
        <nav>
            <a class="secondary-button horror-haverok-link" href="index.html">Főoldal</a>
        </nav>
    </header>

    <main>
        <section class="editor-top">
            <div>
                <h1>Horror Haverok</h1>
                <p>Rendezd a horror karaktereket a kedvenc tier soraidba.</p>
            </div>
            <div class="editor-actions">
                <span id="statusText">Automatikus mentés bekapcsolva</span>
                <button type="button" onclick="addTier()">➕ Új Tier</button>
                <button type="button" class="danger-button" onclick="resetEditor()">🗑️ Alaphelyzet</button>
            </div>
        </section>

        <section id="tierList" class="tier-container"></section>

        <section class="controls">
            <label class="upload-button">
                🖼️ Képek feltöltése
                <input type="file" id="imageInput" accept="image/*" multiple>
            </label>
            <span id="imageCount">0 kép</span>
        </section>

        <section class="image-library">
            <div class="library-title">
                <div>
                    <h2>📦 Képtár</h2>
                    <p>Húzd a képeket a kívánt tier-be.</p>
                </div>
            </div>
            <div id="imagePool" class="image-pool"></div>
        </section>
    </main>

    <script>
        const starterImages = [
            { src: "tier/alien.webp", alt: "Alien" },
            { src: "tier/blackphone.webp", alt: "Black Phone" },
            { src: "tier/chucky.webp", alt: "Chucky" },
            { src: "tier/clarck.webp", alt: "Clarck" },
            { src: "tier/demogorgon.webp", alt: "Demogorgon" },
            { src: "tier/donniedarko.webp", alt: "Donnie Darko" },
            { src: "tier/fisherman.webp", alt: "Fisherman" },
            { src: "tier/freddy.webp", alt: "Freddy" },
            { src: "tier/ghostface.webp", alt: "Ghostface" },
            { src: "tier/hannibal.webp", alt: "Hannibal" },
            { src: "tier/hearteyes.webp", alt: "Heart Eyes" },
            { src: "tier/jason.webp", alt: "Jason" },
            { src: "tier/jigsaw.webp", alt: "Jigsaw" },
            { src: "tier/lugosi.webp", alt: "Lugosi" },
            { src: "tier/michael.webp", alt: "Michael" },
            { src: "tier/penny.webp", alt: "Penny" },
            { src: "tier/predator.webp", alt: "Predator" },
            { src: "tier/scarymovie.webp", alt: "Scary Movie" },
            { src: "tier/megan.webp", alt: "Megan" },
            { src: "tier/pinhead.webp", alt: "Pinhead" },
            { src: "tier/pyramidhed.webp", alt: "Pyramid Head" },
            { src: "tier/springtrap.webp", alt: "Springtrap" },
            { src: "tier/terrifier.webp", alt: "Terrifier" },
            { src: "tier/texas.webp", alt: "Texas" },
            { src: "tier/thering.webp", alt: "The Ring" },
            { src: "tier/vecna.webp", alt: "Vecna" }
        ];

        const defaultTiers = [
            { name: "S", color: "#ff6666" },
            { name: "A", color: "#ffae5d" },
            { name: "B", color: "#ffe066" },
            { name: "C", color: "#8bd38b" },
            { name: "D", color: "#6da8ff" }
        ];

        const storageKey = "horrorHaverokStandaloneTierList";
        const tierContainer = document.getElementById("tierList");
        const imagePool = document.getElementById("imagePool");
        const imageInput = document.getElementById("imageInput");
        const imageCount = document.getElementById("imageCount");
        const statusText = document.getElementById("statusText");
        let draggedElement = null;

        function createImage(src, alt) {
            const wrapper = document.createElement("div");
            wrapper.className = "pool-item";
            wrapper.draggable = true;

            const image = document.createElement("img");
            image.src = src;
            image.alt = alt || "Tier list kép";
            image.className = "tier-image";
            image.draggable = false;

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-image";
            deleteButton.type = "button";
            deleteButton.title = "Kép törlése";
            deleteButton.innerText = "×";
            deleteButton.addEventListener("click", event => {
                event.stopPropagation();
                wrapper.remove();
                updateView();
                saveState();
            });

            wrapper.append(image, deleteButton);
            setupDrag(wrapper);
            return wrapper;
        }

        function createTier(name, color, images = []) {
            const tier = document.createElement("div");
            tier.className = "tier";
            tier.dataset.color = color;

            const label = document.createElement("div");
            label.className = "tier-label";
            label.style.background = color;

            const tierName = document.createElement("div");
            tierName.className = "tier-name";
            tierName.contentEditable = "true";
            tierName.spellcheck = false;
            tierName.innerText = name;
            tierName.addEventListener("input", saveState);

            const buttons = document.createElement("div");
            buttons.className = "tier-buttons";

            const colorButton = document.createElement("button");
            colorButton.className = "small-button";
            colorButton.type = "button";
            colorButton.innerText = "🎨";
            colorButton.title = "Tier színének módosítása";
            colorButton.addEventListener("click", () => {
                const newColor = prompt("Tier színe hex formátumban:", color);
                if (!newColor || !/^#[0-9a-f]{6}$/i.test(newColor.trim())) return;
                tier.dataset.color = newColor.trim();
                label.style.background = newColor.trim();
                saveState();
            });

            const deleteTierButton = document.createElement("button");
            deleteTierButton.className = "small-button";
            deleteTierButton.type = "button";
            deleteTierButton.innerText = "🗑️";
            deleteTierButton.title = "Tier törlése";
            deleteTierButton.addEventListener("click", () => {
                tier.querySelectorAll(".pool-item").forEach(item => imagePool.append(item));
                tier.remove();
                updateView();
                saveState();
            });

            buttons.append(colorButton, deleteTierButton);
            label.append(tierName, buttons);

            const zone = document.createElement("div");
            zone.className = "tier-items drop-zone";
            images.forEach(image => zone.append(createImage(image.src, image.alt)));
            setupDropZone(zone);

            tier.append(label, zone);
            tierContainer.append(tier);
        }

        function createDefaultTiers() {
            tierContainer.innerHTML = "";
            defaultTiers.forEach(tier => createTier(tier.name, tier.color));
        }

        function addTier() {
            createTier(`Tier ${tierContainer.children.length + 1}`, "#777777");
            saveState();
        }

        function resetEditor() {
            if (!confirm("Biztosan törlöd a jelenlegi tier listát?")) return;
            localStorage.removeItem(storageKey);
            tierContainer.innerHTML = "";
            imagePool.innerHTML = "";
            createDefaultTiers();
            starterImages.forEach(image => imagePool.append(createImage(image.src, image.alt)));
            updateView();
            saveState();
        }

        function setupDrag(element) {
            element.addEventListener("dragstart", () => {
                draggedElement = element;
                element.classList.add("dragging");
            });
            element.addEventListener("dragend", () => {
                element.classList.remove("dragging");
                draggedElement = null;
                updateView();
                saveState();
            });
        }

        function setupDropZone(zone) {
            zone.addEventListener("dragover", event => {
                event.preventDefault();
                if (!draggedElement) return;
                const afterElement = getDragAfterElement(zone, event.clientX);
                afterElement ? zone.insertBefore(draggedElement, afterElement) : zone.append(draggedElement);
            });
        }

        imagePool.addEventListener("dragover", event => {
            event.preventDefault();
            if (!draggedElement) return;
            const afterElement = getDragAfterElement(imagePool, event.clientX);
            afterElement ? imagePool.insertBefore(draggedElement, afterElement) : imagePool.append(draggedElement);
        });

        function getDragAfterElement(container, x) {
            return [...container.querySelectorAll(".pool-item:not(.dragging)")]
                .reduce((closest, element) => {
                    const box = element.getBoundingClientRect();
                    const offset = x - box.left - box.width / 2;
                    return offset < 0 && offset > closest.offset ? { offset, element } : closest;
                }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
        }

        imageInput.addEventListener("change", () => {
            [...imageInput.files].forEach(file => {
                if (!file.type.startsWith("image/")) return;
                const reader = new FileReader();
                reader.addEventListener("load", event => {
                    imagePool.append(createImage(event.target.result, file.name));
                    updateView();
                    saveState();
                });
                reader.readAsDataURL(file);
            });
            imageInput.value = "";
        });

        function serializeState() {
            return {
                tiers: [...tierContainer.querySelectorAll(".tier")].map(tier => ({
                    name: tier.querySelector(".tier-name").innerText.trim() || "Tier",
                    color: tier.dataset.color,
                    images: [...tier.querySelectorAll(".tier-image")].map(image => ({ src: image.src, alt: image.alt }))
                })),
                pool: [...imagePool.querySelectorAll(".tier-image")].map(image => ({ src: image.src, alt: image.alt }))
            };
        }

        function saveState() {
            try {
                localStorage.setItem(storageKey, JSON.stringify(serializeState()));
                statusText.innerText = "Automatikusan elmentve";
            } catch (error) {
                statusText.innerText = "A képek túl nagyok a mentéshez";
            }
        }

        function loadState() {
            let saved = null;
            try {
                saved = JSON.parse(localStorage.getItem(storageKey));
            } catch (error) {
                saved = null;
            }

            const data = saved && saved.tiers
                ? saved
                : { tiers: defaultTiers.map(tier => ({ ...tier, images: [] })), pool: [] };

            const usedSources = new Set([
                ...(data.pool || []).map(image => image.src),
                ...(data.tiers || []).flatMap(tier => (tier.images || []).map(image => image.src))
            ]);

            starterImages.forEach(image => {
                if (!usedSources.has(image.src)) {
                    data.pool.push(image);
                    usedSources.add(image.src);
                }
            });

            data.tiers.forEach(tier => createTier(tier.name, tier.color, tier.images || []));
            data.pool.forEach(image => imagePool.append(createImage(image.src, image.alt)));
            updateView();
        }

        function updateView() {
            imageCount.innerText = `${document.querySelectorAll(".tier-image").length} kép`;
            imagePool.querySelector(".empty-message")?.remove();
            if (!imagePool.querySelector(".pool-item")) {
                const empty = document.createElement("div");
                empty.className = "empty-message";
                empty.innerText = "A képtár üres. Tölts fel képeket, majd húzd őket a tier-ekbe.";
                imagePool.append(empty);
            }
        }

        loadState();
    </script>
</body>
</html>
